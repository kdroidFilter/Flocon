# Manual GraalVM package build (no publish) — same build pattern as release.yml.
name: Build Desktop App

on:
  workflow_dispatch:

jobs:
  build:
    name: GraalVM - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            arch: amd64

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_VERSION_NAME: "1.0.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Nucleus (GraalVM)
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.3.0
        with:
          graalvm: 'true'

      - name: Build GraalVM native packages
        working-directory: FloconDesktop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :composeApp:packageGraalvmNativeDistributionForCurrentOS \
            -PnativeMarch=compatibility \
            --stacktrace \
            --no-daemon

      - name: Upload GraalVM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-flocon-${{ runner.os }}-${{ matrix.arch }}
          path: |
            FloconDesktop/composeApp/build/compose/binaries/**/graalvm-*/**
          if-no-files-found: error
