# Adapted from NucleusFramework/Nucleus GraalVM release pipeline:
# https://github.com/NucleusFramework/Nucleus/blob/v2.3.0/.github/workflows/release-graalvm.yaml
name: Build Desktop App then create a new release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-graalvm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: GraalVM - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            arch: amd64
          - name: Windows x64
            os: windows-latest
            arch: amd64
          - name: macOS ARM64
            os: macos-latest
            arch: arm64
          # macOS Intel is intentionally excluded: GraalVM CE ships no macos-x64 build for the
          # current feature release, so the toolchain falls back to Liberica NIK (graal 25.0 base),
          # whose native-image cannot compile Netty's java.lang.foreign malloc downcall
          # (VMError: unexpected input could not be handled: linkToNative).

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalize version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "PROJECT_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # graalvm:true → MSVC / Xcode 26 + cache ~/.gradle/nucleus/graalvm
      # JDK GraalVM is still auto-downloaded by the Nucleus plugin.
      - name: Setup Nucleus (GraalVM)
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.3.0
        with:
          java-version: '21'
          graalvm: 'true'

      - name: Build GraalVM native packages
        working-directory: FloconDesktop
        shell: bash
        # GraalVM CE is resolved via the GitHub releases API — authenticate to avoid rate limits.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # packageGraalvmNativeDistributionForCurrentOS only builds the app folder — it does not
        # wire the per-format tasks. Installers must be requested explicitly, as the upstream
        # Nucleus release-graalvm pipeline does.
        # -PnativeMarch=compatibility: portable binary (same as Nucleus release-graalvm).
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            TASKS=":composeApp:packageGraalvmDeb :composeApp:packageGraalvmRpm :composeApp:packageGraalvmAppImage"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Zip carries the macOS self-update payload (and its latest-mac.yml manifest).
            TASKS=":composeApp:packageGraalvmDmg :composeApp:packageGraalvmZip"
          else
            TASKS=":composeApp:packageGraalvmNsis :composeApp:packageGraalvmPortable"
          fi
          ./gradlew $TASKS \
            -PnativeMarch=compatibility \
            --stacktrace \
            --no-daemon

      - name: Upload GraalVM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-flocon-${{ runner.os }}-${{ matrix.arch }}
          path: |
            FloconDesktop/composeApp/build/compose/binaries/**/graalvm-*/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download all GraalVM artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: graalvm-flocon-*

      - name: Determine version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Installers + optional detached signatures / update yml (same set as Nucleus release-graalvm).
          # graalvm-app/ holds the unpackaged distributable — its raw launcher would otherwise be
          # collected as if it were the Windows installer.
          find artifacts -type f -not -path '*/graalvm-app/*' \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.asc' -o \
            -name '*.AppImage' -o -name '*.appimage' -o \
            -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o \
            -name 'latest*.yml' -o -name 'beta*.yml' -o -name 'alpha*.yml' \
          \) -exec cp -n {} release-assets/ \;
          echo "==> Release assets:"
          ls -lh release-assets/ || true
          if [ ! "$(ls -A release-assets/)" ]; then
            echo "::error::No release assets found"
            exit 1
          fi

      - name: Upload to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if ! gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            ARGS=(release create "$TAG" --title "$TAG" --generate-notes -R "$REPO")
            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh "${ARGS[@]}"
          fi

          gh release upload "$TAG" release-assets/* --clobber -R "$REPO"
